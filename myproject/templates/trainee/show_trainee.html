{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'trainee/css/main.css' %}">
</head>
<body class="body">
    <div>
    <table border="1" style="width: 100%; text-align: center; border-collapse: collapse;">
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Active</th>
            </tr>
        <tbody>
            {% for user_data in trainees %}
            <tr>
                <td>{{ user_data.first_name }}</td>
                <td>{{ user_data.last_name }}</td>
                <td>{{ user_data.email }}</td>
                <td>{{ user_data.Activity }}</td>
                <td>
                    <form action="{% url 'delete_trainee' user_data.id %}" method="POST" style="margin: 0;">
                        {% csrf_token %}
                        <button type="submit" class="button delete-btn">Delete</button>
                    </form>
                    <form action="{% url 'Activity' user_data.id %}" method="POST" style="margin: 0;">
                        {% csrf_token %}
                        <button type="submit" class="button xorActivity-btn">Change Activity</button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No trainees found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
